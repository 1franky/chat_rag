[project]
name = "rag-shared"
version = "0.1.0"
description = "Librería común: parsers de documentos, chunking y modelos pydantic compartidos entre web y rag-mcp"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "langchain-text-splitters>=0.2",
    "pypdf>=4.3",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pytesseract>=0.3",
    "pillow>=10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_shared"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
