[project]
name = "rag-shared"
version = "0.1.0"
description = "Librería común: parsers de documentos, chunking y modelos pydantic compartidos entre web y rag-mcp"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "langchain-text-splitters>=0.2",
    "pypdf>=4.3",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    # reports.py::write_pdf (plan-v3.md, Fase 21) — más simple que reportlab
    # para el caso de uso (secciones de título + párrafos, sin layout
    # elaborado); reportlab da más control si algún día hace falta algo más
    # complejo.
    "fpdf2>=2.7",
    "pandas>=2.2",
    "pytesseract>=0.3",
    "pillow>=10.4",
    # Detección real de mime type (mira los bytes, no la extensión). Necesita
    # la lib de sistema libmagic1 (se instala en el Dockerfile de chat-worker).
    "python-magic>=0.4",
    # embeddings.py (compartido entre chat-rag-mcp y la task de ingesta de
    # chat-worker, así no se carga el modelo dos veces con lógica duplicada).
    "sentence-transformers>=3.0",
    "torch>=2.2",
    # embeddings.py: modelo sparse BM25 (plan-v2.md, Fase 12 — búsqueda
    # híbrida). Se integra nativamente con qdrant-client para sparse
    # vectors, no hace falta mantener un índice BM25 aparte. Trae
    # onnxruntime (CPU) como dependencia, ya viene CPU-only desde PyPI (a
    # diferencia de torch) — no necesita el override de índice de abajo.
    "fastembed>=0.4,<1",
    # vector_store.py: server pineado en compose.yaml a qdrant/qdrant:v1.17.1
    # — mantener el cliente a máximo 1 minor de diferencia.
    "qdrant-client>=1.17,<1.19",
    # logging.py: config compartida de logs estructurados (plan.md, Fase 7).
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_shared"]

[tool.uv.sources]
# Sin GPU (plan.md, sección 1): fuerza el build CPU-only de torch. El wheel
# default de PyPI trae las librerías CUDA (~2 GB) como dependencia aunque
# nunca se usen en este host ARM64 sin GPU. Tiene que declararse acá Y en
# cada proyecto que dependa de rag-shared (web/, rag-mcp/): el override de
# [tool.uv.sources] de un paquete transitivo no se aplica solo, cada `uv
# sync` resuelve su propio árbol.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
