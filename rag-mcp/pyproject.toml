[project]
name = "chat-rag-mcp"
version = "0.1.0"
description = "Servidor MCP del RAG: búsqueda semántica sobre documentos indexados en Qdrant"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.10",
    "pydantic>=2.8",
    "structlog>=24.4",
    "rag-shared",
]

[tool.uv]
package = false

[tool.uv.sources]
rag-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
