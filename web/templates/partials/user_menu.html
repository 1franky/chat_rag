{% if request.user.is_authenticated %}
<div class="flex items-center justify-between gap-2 text-sm">
  <span class="truncate" title="{{ request.user.username }}">{{ request.user.username }}</span>
  <form method="post" action="{% url 'accounts:logout' %}">
    {% csrf_token %}
    <button
      type="submit"
      class="rounded px-2 py-1 text-slate-600 hover:bg-slate-200 dark:text-slate-300 dark:hover:bg-slate-800"
    >
      Salir
    </button>
  </form>
</div>
{% endif %}
