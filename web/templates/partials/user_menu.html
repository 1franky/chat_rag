{% if request.user.is_authenticated %}
<div class="flex items-center justify-between gap-1 text-sm">
  <span class="truncate" title="{{ request.user.username }}">{{ request.user.username }}</span>
  <div class="flex shrink-0 items-center gap-1">
    <a
      href="{% url 'accounts:settings' %}"
      class="rounded-md p-1.5 text-muted-foreground hover:bg-accent hover:text-accent-foreground"
      aria-label="Configuración"
      title="Configuración"
    >
      ⚙
    </a>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button
        type="submit"
        class="rounded-md px-2 py-1.5 text-muted-foreground hover:bg-accent hover:text-accent-foreground"
      >
        Salir
      </button>
    </form>
  </div>
</div>
{% endif %}
