{# Contenedor de toasts: los mensajes de Django (server-side) se vuelcan acá
   al cargar la página; los que dispara JS directo llaman a
   `Alpine.store('toast').push(...)` (ver static/js/toast.js). #}
<div
  x-data
  x-init="
    {% for message in messages %}
      $store.toast.push('{{ message.message|escapejs }}', '{{ message.tags|default:'success' }}');
    {% endfor %}
  "
  class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-full max-w-sm flex-col gap-2"
>
  <template x-for="item in $store.toast.items" :key="item.id">
    <div
      x-show="true"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 translate-y-2"
      x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="pointer-events-auto flex items-start gap-2 rounded-md border px-3 py-2 text-sm shadow-lg"
      :class="item.type === 'error' ? 'border-destructive/30 bg-destructive text-destructive-foreground' : 'border-border bg-card text-card-foreground'"
    >
      <span class="flex-1" x-text="item.text"></span>
      <button type="button" @click="$store.toast.remove(item.id)" class="opacity-70 hover:opacity-100" aria-label="Cerrar">
        ✕
      </button>
    </div>
  </template>
</div>
