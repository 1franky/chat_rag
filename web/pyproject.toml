[project]
name = "chat-web"
version = "0.1.0"
description = "Django app: chat (Agent SDK + streaming), ingesta de documentos y autenticación de chat_rag"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.1",
    "channels>=4.1",
    "daphne>=4.1",
    "whitenoise>=6.7",
    "celery>=5.4",
    "redis>=5.0",
    "claude-agent-sdk>=0.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    "structlog>=24.4",
    "rag-shared",
]

[tool.uv]
package = false

[tool.uv.sources]
rag-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
]
