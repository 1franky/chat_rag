[project]
name = "chat-web"
version = "0.1.0"
description = "Django app: chat (Agent SDK + streaming), ingesta de documentos y autenticación de chat_rag"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.1",
    "channels>=4.1",
    "daphne>=4.1",
    "whitenoise>=6.7",
    "celery>=5.4",
    "redis>=5.0",
    "claude-agent-sdk>=0.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    "structlog>=24.4",
    "rag-shared",
    # chat-worker embebe y sube a Qdrant al procesar la ingesta (Fase 3),
    # usando rag_shared.embeddings/vector_store. torch va directo (no solo
    # transitivo vía rag-shared) para que el override de índice CPU-only de
    # abajo aplique seguro — ver la nota en shared/pyproject.toml.
    "torch>=2.2",
    "qdrant-client>=1.17,<1.19",
]

[tool.uv]
package = false

[tool.uv.sources]
rag-shared = { path = "../shared", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
]
