# Logging driver nativo de Docker (plan.md, Fase 7) en vez de logrotate: los
# tres servicios propios lo loguean todo a stdout/stderr (ver
# rag_shared.logging), y json-file con max-size/max-file rota y trunca ahí
# mismo — logrotate apunta a archivos en el filesystem del host, que acá no
# aplica bien (read_only: true en los servicios propios).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  chat-qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    volumes:
      - chat-qdrant-data:/qdrant/storage
      - ./data/qdrant-snapshots:/qdrant/snapshots
    expose: ["6333", "6334"]
    # Sin ports: al host — solo accesible en la red ai-platform
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333"
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks: [ai-platform]

  chat-redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # El entrypoint de la imagen oficial arranca como root y usa setpriv
    # para bajar a "redis" (uid 999) — eso pide CAP_SETUID/CAP_SETGID, que
    # cap_drop: [ALL] le saca. Arrancando ya como ese usuario nos saltamos
    # el paso de setpriv y no hace falta devolverle esas capabilities.
    user: "999:1000"
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs: [/tmp:size=8m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 15s
    networks: [ai-platform]

  chat-rag-mcp:
    build:
      context: .
      dockerfile: rag-mcp/Dockerfile
    image: chat-rag-mcp:0.1.0
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        # 512M (el original de la Fase 2) alcanzaba para el healthcheck y
        # las tools stub, pero nunca se probó bajo este límite con
        # rag_search haciendo una embedding de verdad (Fase 3 lo probó en
        # contenedores sueltos, sin límite de memoria) — cargar el modelo
        # en memoria por primera vez lo hacía reiniciar en cada llamada
        # real desde la Fase 4. 1.5G alcanzaba para el modelo denso + el
        # sparse (BM25, liviano) de la Fase 12. Fase 17 (reranking) sumó un
        # tercer modelo — se evaluó primero un cross-encoder de fastembed
        # de 1.1GB (ver el comentario de RERANK_MODEL más abajo) que ni con
        # 6G de límite andaba a una velocidad utilizable; con el modelo más
        # chico que se terminó usando (~470MB, sentence-transformers), los
        # tres modelos cargados en un turno real de chat miden ~1.3GB en
        # este host — 2.5G deja margen razonable sin sobre-reservar en un
        # host compartido con otros proyectos.
        limits: { cpus: "1.0", memory: 2.5G }
    env_file: .env
    environment:
      QDRANT_URL: http://chat-qdrant:6333
      QDRANT_COLLECTION: rag_documents
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      # Búsqueda híbrida (plan-v2.md, Fase 12) — debe coincidir con el
      # mismo valor en chat-worker, es el que se usó para indexar.
      SPARSE_EMBEDDING_MODEL: Qdrant/bm25
      # Reranking (plan-v3.md, Fase 17) — solo lo usa rag_search acá, no
      # hace falta que coincida con nada de chat-worker (no participa de
      # la indexación, solo reordena candidatos ya buscados). Cross-encoder
      # sentence-transformers, no fastembed/onnx — ver el comentario de
      # RERANK_MODEL en rag_shared/embeddings.py para por qué se descartó
      # el único modelo multilingüe que trae fastembed (demasiado lento en
      # este host).
      RERANK_MODEL: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
      # threads=1: mismo motivo que en embeddings.py — tiene que matchear
      # el límite de cpus de este contenedor (1.0) para que torch no
      # oversubscriba threads que el cgroup termina throttleando.
      RERANK_THREADS: "1"
      MODEL_CACHE_DIR: /app/models
      DJANGO_SQLITE_PATH: /data/sqlite/db.sqlite3
      # Reportería (plan-v3.md, Fase 20) — mismo directorio del host que
      # settings.REPORTS_DIR de chat-web (MEDIA_ROOT / "reports"), visto
      # desde acá con su propio mount RW más abajo.
      REPORTS_DIR: /data/media/reports
      # PUBLIC_BASE_URL (para armar el link de descarga que devuelve
      # report_generate_table) NO se declara acá a propósito — mismo
      # criterio que chat-web más abajo, que tampoco la declara pese a
      # usarla (config/settings.py): `env_file: .env` ya la inyecta sola,
      # no hace falta repetirla. A diferencia de chat-web, acá no hay
      # request de donde caer si faltara — ver el comentario en
      # rag-mcp/server.py.
    volumes:
      - models-cache:/app/models
      # rag_list_documents lee filename/status/chunk_count de la tabla
      # Document de Django directo por sqlite3 (rag_shared.documents_db) —
      # solo lectura, chat-web/chat-worker son los únicos que escriben ahí.
      - ./data/sqlite:/data/sqlite:ro
      # RW (a diferencia del mount de arriba) — acá SÍ escribe este
      # contenedor: los archivos que arma report_generate_table. Acotado a
      # la subcarpeta reports/, no todo ./data/media (que también tiene
      # los documentos subidos a /documentos/, sin necesidad de que
      # chat-rag-mcp los toque).
      - ./data/media/reports:/data/media/reports
    expose: ["8100"]
    read_only: true
    tmpfs: [/tmp:size=32m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # DAC_OVERRIDE (mismo motivo que chat-worker más abajo): corre como
    # root sin `user:` propio, pero ./data/media/reports es un bind mount
    # del host que pertenece a tu usuario, no a root — sin esta capability
    # (que cap_drop: [ALL] saca por default), root no puede saltarse esos
    # permisos de archivo y la escritura falla. Efecto secundario: los
    # archivos que este contenedor escribe quedan con dueño root:root en
    # el host, a diferencia del resto de ./data/media (dueño de tu
    # usuario) — no es un problema porque chat-web solo necesita LEERLOS
    # para servir la descarga, no modificarlos.
    cap_add: [DAC_OVERRIDE]
    depends_on:
      chat-qdrant: { condition: service_healthy }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 30s
    networks: [ai-platform]

  chat-worker:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: worker
    # Nombre de imagen propio, distinto del de chat-web: aunque salen del
    # mismo Dockerfile, son targets con contenido distinto (este instala
    # tesseract/libmagic y hornea el modelo de embeddings) — compartir tag
    # hace que el build de uno pise el del otro y quede corriendo cualquiera
    # de los dos según cuál se haya buildeado último.
    image: chat-worker:0.1.0
    restart: unless-stopped
    logging: *default-logging
    command: celery -A config worker -l info -c 2
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    env_file: .env
    environment:
      SERVICE_NAME: chat-worker
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: sqlite:////data/sqlite/db.sqlite3
      REDIS_URL: redis://chat-redis:6379/0
      QDRANT_URL: http://chat-qdrant:6333
      QDRANT_COLLECTION: rag_documents
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      # Búsqueda híbrida (plan-v2.md, Fase 12) — debe coincidir con el
      # mismo valor en chat-rag-mcp, es el que se usa al buscar.
      SPARSE_EMBEDDING_MODEL: Qdrant/bm25
      MODEL_CACHE_DIR: /app/models
      MEDIA_ROOT: /data/media
    volumes:
      - ./data/sqlite:/data/sqlite
      - ./data/media:/data/media
      - models-cache:/app/models
    depends_on:
      chat-redis: { condition: service_healthy }
      chat-qdrant: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # El proceso corre como root (sin USER en el Dockerfile) pero escribe en
    # ./data/sqlite y ./data/media, bind mounts del host que son de tu
    # usuario, no de root. Sin CAP_DAC_OVERRIDE, root deja de poder saltarse
    # los permisos de archivo (deja de ser "root" a esos efectos) y la
    # escritura falla con "unable to open database file".
    cap_add: [DAC_OVERRIDE]
    networks: [ai-platform]

  chat-web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: web
    image: chat-web:0.1.0
    restart: unless-stopped
    logging: *default-logging
    # uvicorn, no daphne — ver la nota en web/pyproject.toml. --loop asyncio
    # (no uvloop, aunque uvicorn[standard] lo trae e "auto" lo elegiría):
    # uvloop envuelve libuv, que tiene su propio manejo de señales/reaping
    # de procesos hijos — mismo tipo de conflicto que Twisted con el
    # subproceso `claude` del Agent SDK.
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --loop asyncio
    # El Agent SDK (chat/agent.py) corre con permission_mode=bypassPermissions
    # (--dangerously-skip-permissions) porque es uso 100% personal, sin UI de
    # aprobación de tools — pero el CLI de Claude Code se niega a arrancar con
    # esa flag si el proceso es root ("cannot be used with root/sudo
    # privileges for security reasons"). Corre con el uid:gid del host dueño
    # de ./data/* (APP_UID/APP_GID en .env — correr `id -u`/`id -g` en el
    # host para saber cuáles poner) — de paso ya no hace falta
    # CAP_DAC_OVERRIDE acá, como sí en chat-worker.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    deploy:
      resources:
        # 512M (el original de la Fase 0) no alcanza: el binario `claude`
        # del Agent SDK (compilado con Bun) sólo para arrancar ya pica
        # ~0.6 GB de pico — con Django corriendo al lado, la primera
        # respuesta se comía toda la memoria y el proceso abortaba
        # ("cannot allocate memory", ni un crash claro). Se probó y
        # confirmó soltando el límite del todo antes de subirlo acá.
        limits: { cpus: "1.5", memory: 2G }
    env_file: .env
    environment:
      SERVICE_NAME: chat-web
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: sqlite:////data/sqlite/db.sqlite3
      REDIS_URL: redis://chat-redis:6379/0
      DATA_PLATFORM_MCP_URL: http://data-platform-mcp:8000/mcp
      RAG_MCP_URL: http://chat-rag-mcp:8100/mcp
      MEDIA_ROOT: /data/media
      # El Agent SDK necesita un CLAUDE_CONFIG_DIR escribible (guarda ahí el
      # transcript de cada sesión, para poder resumir la conversación en el
      # siguiente mensaje) — no puede ser el mount de ~/.claude de abajo,
      # que es de solo lectura a propósito. entrypoint.sh siembra este
      # directorio con las credenciales en cada arranque (ver ese archivo).
      CLAUDE_CONFIG_DIR: /data/claude-config
      # ALLOWED_HOSTS y CSRF_TRUSTED_ORIGINS NO se hardcodean acá a propósito:
      # dependen de cómo accedés (localhost, túnel, dominio propio), así que
      # se toman de .env (env_file más arriba). Ver .env.example.
      # ANTHROPIC_API_KEY: se lee del volumen ~/.claude si usas suscripción Pro
    volumes:
      - ./data/sqlite:/data/sqlite
      - ./data/media:/data/media
      - ./data/claude-config:/data/claude-config
      # Credenciales de Claude Code (suscripción Pro) — de solo lectura a
      # propósito, entrypoint.sh las copia a CLAUDE_CONFIG_DIR arriba. En
      # /creds y no /root: el contenedor corre como usuario sin privilegios
      # (ver `user:` arriba) y /root es 0700 — no podría ni entrar ahí.
      - ${HOME}/.claude:/creds/claude-readonly:ro
      - ${HOME}/.claude.json:/creds/claude-readonly.json:ro
    ports:
      - "127.0.0.1:3004:8000"
    depends_on:
      chat-redis: { condition: service_healthy }
      chat-rag-mcp: { condition: service_healthy }
      chat-qdrant: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Sin cap_add: [DAC_OVERRIDE] a propósito — a diferencia de chat-worker,
    # corre con `user:` (arriba) matcheando el dueño real de ./data/*, así
    # que no hace falta que root se salte los permisos de archivo.
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
    networks: [ai-platform]

networks:
  ai-platform:
    name: ai-platform
    external: true

volumes:
  redis-data:
  models-cache:
  chat-qdrant-data:
