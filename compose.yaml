services:
  chat-qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    volumes:
      - chat-qdrant-data:/qdrant/storage
      - ./data/qdrant-snapshots:/qdrant/snapshots
    expose: ["6333", "6334"]
    # Sin ports: al host — solo accesible en la red ai-platform
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333"
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks: [ai-platform]

  chat-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # El entrypoint de la imagen oficial arranca como root y usa setpriv
    # para bajar a "redis" (uid 999) — eso pide CAP_SETUID/CAP_SETGID, que
    # cap_drop: [ALL] le saca. Arrancando ya como ese usuario nos saltamos
    # el paso de setpriv y no hace falta devolverle esas capabilities.
    user: "999:1000"
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs: [/tmp:size=8m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 15s
    networks: [ai-platform]

  chat-rag-mcp:
    build:
      context: .
      dockerfile: rag-mcp/Dockerfile
    image: chat-rag-mcp:0.1.0
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    env_file: .env
    environment:
      QDRANT_URL: http://chat-qdrant:6333
      QDRANT_COLLECTION: rag_documents
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      MODEL_CACHE_DIR: /app/models
      DJANGO_SQLITE_PATH: /data/sqlite/db.sqlite3
    volumes:
      - models-cache:/app/models
      # rag_list_documents lee filename/status/chunk_count de la tabla
      # Document de Django directo por sqlite3 (rag_shared.documents_db) —
      # solo lectura, chat-web/chat-worker son los únicos que escriben ahí.
      - ./data/sqlite:/data/sqlite:ro
    expose: ["8100"]
    read_only: true
    tmpfs: [/tmp:size=32m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      chat-qdrant: { condition: service_healthy }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 30s
    networks: [ai-platform]

  chat-worker:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: worker
    # Nombre de imagen propio, distinto del de chat-web: aunque salen del
    # mismo Dockerfile, son targets con contenido distinto (este instala
    # tesseract/libmagic y hornea el modelo de embeddings) — compartir tag
    # hace que el build de uno pise el del otro y quede corriendo cualquiera
    # de los dos según cuál se haya buildeado último.
    image: chat-worker:0.1.0
    restart: unless-stopped
    command: celery -A config worker -l info -c 2
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: sqlite:////data/sqlite/db.sqlite3
      REDIS_URL: redis://chat-redis:6379/0
      QDRANT_URL: http://chat-qdrant:6333
      QDRANT_COLLECTION: rag_documents
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      MODEL_CACHE_DIR: /app/models
      MEDIA_ROOT: /data/media
    volumes:
      - ./data/sqlite:/data/sqlite
      - ./data/media:/data/media
      - models-cache:/app/models
    depends_on:
      chat-redis: { condition: service_healthy }
      chat-qdrant: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # El proceso corre como root (sin USER en el Dockerfile) pero escribe en
    # ./data/sqlite y ./data/media, bind mounts del host que son de tu
    # usuario, no de root. Sin CAP_DAC_OVERRIDE, root deja de poder saltarse
    # los permisos de archivo (deja de ser "root" a esos efectos) y la
    # escritura falla con "unable to open database file".
    cap_add: [DAC_OVERRIDE]
    networks: [ai-platform]

  chat-web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: web
    image: chat-web:0.1.0
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 512M }
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: sqlite:////data/sqlite/db.sqlite3
      REDIS_URL: redis://chat-redis:6379/0
      DATA_PLATFORM_MCP_URL: http://data-platform-mcp:8000/mcp
      RAG_MCP_URL: http://chat-rag-mcp:8100/mcp
      MEDIA_ROOT: /data/media
      # ALLOWED_HOSTS y CSRF_TRUSTED_ORIGINS NO se hardcodean acá a propósito:
      # dependen de cómo accedés (localhost, túnel, dominio propio), así que
      # se toman de .env (env_file más arriba). Ver .env.example.
      # ANTHROPIC_API_KEY: se lee del volumen ~/.claude si usas suscripción Pro
    volumes:
      - ./data/sqlite:/data/sqlite
      - ./data/media:/data/media
      - ${HOME}/.claude:/root/.claude:ro  # credencial de Claude Code
    ports:
      - "127.0.0.1:3004:8000"
    depends_on:
      chat-redis: { condition: service_healthy }
      chat-rag-mcp: { condition: service_healthy }
      chat-qdrant: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]  # ver el comentario en chat-worker
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
    networks: [ai-platform]

networks:
  ai-platform:
    name: ai-platform
    external: true

volumes:
  redis-data:
  models-cache:
  chat-qdrant-data:
